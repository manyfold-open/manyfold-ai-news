# Checks every push and pull request; deploys main to app.manyfold.ai/ai-news when Cloudflare
# repository secrets are configured (CLOUDFLARE_API_TOKEN and optional CLOUDFLARE_ACCOUNT_ID).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  deploy:
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - name: Verify Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not configured yet; skipping deploy until repo secret is added."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.skip != 'true'
        run: npm ci
      # Build first: wrangler deploys the config the Cloudflare Vite plugin writes to dist/.
      - if: steps.creds.outputs.skip != 'true'
        run: npm run build
      - if: steps.creds.outputs.skip != 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9af64e6d33831f8a0718d0db1ad49c06' }}
      - if: steps.creds.outputs.skip != 'true'
        name: Health check
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://app.manyfold.ai/ai-news/api/health
      - if: steps.creds.outputs.skip != 'true'
        name: Smoke test
        run: npm run smoke -- https://app.manyfold.ai/ai-news
