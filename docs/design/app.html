<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI in 5 · Monday, October 12</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Schibsted+Grotesk:wght@400..700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Tokens: four fills, four meanings.
   white = the news, marker = a number checked against its source,
   stone = our analysis, mint = answers to the reader's questions. */
:root {
  --paper: #FFFFFF;
  --ink: #000000;
  --graphite: #5F5E58;
  --hairline: #E6E4DE;
  --marker: #FFE45C;
  --marker-soft: #FFF6C4;
  --stone: #F2F1ED;
  --mint: #DFF1E6;
  --green: #0A5A39;
  --green-soft: #3D5E50;
  --serif: "Newsreader", "Noto Serif SC", Georgia, serif;
  --sans: "Schibsted Grotesk", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --measure: 40rem;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.55;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}
html[lang="zh"] body { font-size: 17px; line-height: 1.75; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
.sans { font-family: var(--sans); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.measure { max-width: var(--measure); }

/* ── progress ── */
.progress { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 20; pointer-events: none; }
.progress span { display: block; height: 100%; width: 0; background: var(--ink); }

/* ── masthead ── */
.masthead { padding-top: 18px; }
.topline { display: flex; justify-content: space-between; align-items: center; }
.wordmark { display: inline-flex; align-items: center; }
.wordmark .lockup { height: 27px; width: auto; display: block; }
.langs { display: flex; gap: 10px; }
.langs button {
  font: 500 14px/1 var(--sans); background: none; border: 0; padding: 10px 2px;
  color: var(--graphite); cursor: pointer;
}
.langs button[aria-pressed="true"] { color: var(--ink); text-decoration: underline 2px; text-underline-offset: 6px; }
.date {
  font-weight: 400; font-size: 44px; line-height: 1.02; letter-spacing: -0.02em;
  margin: 30px 0 10px; font-variation-settings: "opsz" 72;
}
html[lang="zh"] .date { font-size: 38px; letter-spacing: 0; line-height: 1.2; }
.dek { font: 400 15px/1.4 var(--sans); color: var(--graphite); margin: 0 0 18px; }
.world { display: block; width: 100%; max-width: var(--measure); height: auto; margin: 4px 0 8px; }
.coverage { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; }
.coverage li { font: 500 13px/1.3 var(--sans); color: var(--graphite); }
.coverage b { color: var(--ink); font-weight: 600; }
.squares { display: flex; gap: 3px; margin-bottom: 6px; }
.squares i { width: 10px; height: 10px; background: var(--ink); display: block; }

/* ── today in 3 ── */
.today { margin-top: 34px; }
.label { font: 600 14px/1.3 var(--sans); margin: 0 0 6px; }
.t3 { list-style: none; margin: 0; padding: 0; }
.t3 a {
  display: block; padding: 12px 0; border-bottom: 1px solid var(--hairline);
  font-size: 21px; line-height: 1.3; text-decoration: none; font-variation-settings: "opsz" 24;
}
.t3 li:first-child a { border-top: 1px solid var(--ink); }
.t3 li:last-child a { border-bottom: 0; }
html[lang="zh"] .t3 a { font-size: 19px; line-height: 1.55; }

/* ── stories ── */
.story { padding: 36px 0 34px; border-top: 1px solid var(--hairline); }
.story.is-top { border-top: 2px solid var(--ink); margin-top: 40px; }
.meta { font: 400 14px/1.3 var(--sans); color: var(--graphite); margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
.meta .region { color: var(--ink); font-weight: 600; }
.meta { align-items: center; }
.logo {
  width: 28px; height: 28px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  background: #FFFFFF; border: 1px solid var(--hairline); border-radius: 7px;
}
.logo svg { width: 20px; height: 20px; display: block; }
.brief .logo { width: 24px; height: 24px; border-radius: 6px; }
.brief .logo svg { width: 17px; height: 17px; }
.title {
  font-weight: 500; font-size: 25px; line-height: 1.18; letter-spacing: -0.01em;
  margin: 8px 0 12px; font-variation-settings: "opsz" 36; text-wrap: balance;
}
.is-top .title { font-size: 32px; line-height: 1.12; letter-spacing: -0.015em; font-variation-settings: "opsz" 60; }
html[lang="zh"] .title { font-weight: 600; letter-spacing: 0; line-height: 1.35; font-size: 22px; text-wrap: pretty; }
html[lang="zh"] .is-top .title { font-size: 27px; line-height: 1.3; }
.summary { margin: 0 0 4px; }

.mark {
  cursor: pointer; padding: 0 .12em; margin: 0 -.04em; border-radius: 2px;
  background: linear-gradient(to bottom, transparent .2em, var(--marker) .2em, var(--marker) calc(100% - .06em), transparent calc(100% - .06em));
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.mark[aria-expanded="true"] { box-shadow: inset 0 -2px 0 var(--ink); }
.proof {
  background: var(--marker-soft); border-radius: 4px; padding: 12px 14px; margin: 8px 0 14px;
  font: 400 14px/1.45 var(--sans);
}
.proof-head { font-weight: 600; margin: 0 0 4px; }
.proof-quote { font: italic 400 16px/1.45 var(--serif); margin: 0 0 6px; }
.proof-meta { color: var(--graphite); margin: 0; }

.why { background: var(--stone); border-radius: 4px; padding: 14px 16px 16px; margin-top: 16px; }
.why p:last-child, .next p:last-child { margin: 0; font-size: 17px; line-height: 1.5; }
html[lang="zh"] .why p:last-child, html[lang="zh"] .next p:last-child { font-size: 16px; line-height: 1.7; }
.next { padding: 14px 16px 0; }

.sources { margin-top: 14px; font: 400 14px/1.4 var(--sans); color: var(--graphite); }
.sources-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.text-btn {
  font: 600 14px/1.3 var(--sans); color: var(--ink); background: none; border: 0; padding: 10px 0;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.source-list { list-style: none; padding: 0; margin: 2px 0 0; }
.source-list li { display: grid; grid-template-columns: 5.8rem 1fr auto; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--hairline); align-items: baseline; }
html[lang="zh"] .source-list li { grid-template-columns: 4.8rem 1fr auto; }
.source-list .kind { color: var(--ink); font-weight: 600; }
.source-list a { color: var(--ink); font-weight: 500; }

/* ── ask ── */
.story-ask { margin-top: 22px; font-family: var(--sans); }
.ask-label { font: 600 14px/1.3 var(--sans); color: var(--green); margin: 0 0 4px; }
.ask-list { list-style: none; margin: 0; padding: 0; }
.ask-q, .ask-own {
  display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 14px;
  text-align: left; background: none; border: 0; border-top: 1px solid var(--hairline);
  padding: 12px 0; min-height: 46px; font: 400 16px/1.4 var(--sans); cursor: pointer;
}
.ask-own { font-weight: 600; color: var(--green); border-bottom: 1px solid var(--hairline); }
.pm { flex: none; width: 12px; height: 12px; position: relative; }
.pm::before, .pm::after { content: ""; position: absolute; background: var(--green); }
.pm::before { left: 0; right: 0; top: 5px; height: 2px; }
.pm::after { top: 0; bottom: 0; left: 5px; width: 2px; transition: transform .18s ease; }
[aria-expanded="true"] > .pm::after { transform: scaleY(0); }

.answer { background: var(--mint); border-radius: 4px; padding: 14px 16px; margin: 0 0 12px; font: 400 16px/1.5 var(--sans); }
.answer.is-new { animation: reveal .24s ease-out; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
.status { display: flex; align-items: center; gap: 8px; font: 600 13px/1.3 var(--sans); color: var(--green); margin: 0 0 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid var(--green); }
.dot.answered { background: var(--green); }
.dot.partial { background: linear-gradient(90deg, var(--green) 50%, transparent 50%); }
.answer-text { margin: 0 0 10px; }
.cite-ref {
  font: 700 11px/0 var(--sans); color: var(--green); text-decoration: none;
  vertical-align: super; padding: 0 1px 0 2px;
}
.cites { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid rgba(10, 90, 57, .2); }
.cites li { font: 400 13.5px/1.45 var(--sans); color: var(--green-soft); margin: 0 0 8px; }
.cite-n { font-weight: 700; color: var(--green); margin-right: 6px; }
.cite-quote { display: block; font: italic 400 15px/1.45 var(--serif); color: var(--ink); margin: 2px 0; }
.cite-quote:lang(zh), .cite-quote:lang(ja), .proof-quote:lang(zh), .proof-quote:lang(ja) { font-style: normal; }
.answer-foot { font: 400 12.5px/1.4 var(--sans); color: var(--green-soft); margin: 4px 0 0; }
.answer-foot .text-btn { font-size: 12.5px; padding: 4px 0; color: var(--green-soft); }
.look-further { display: block; margin-top: 8px; font: 600 14px/1.3 var(--sans); color: var(--green); background: none; border: 1px solid var(--green); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
.look-note { margin: 8px 0 0; font-size: 13px; color: var(--green-soft); }

/* ── visuals: our charts, or the source's own image ── */
.visual { margin: 18px 0 4px; }
.fg-title { font: 600 14px/1.35 var(--sans); margin: 0; }
.fg-note { font: 400 13px/1.4 var(--sans); color: var(--graphite); margin: 2px 0 12px; }
.fg-credit { font: 400 12.5px/1.45 var(--sans); color: var(--graphite); margin: 10px 0 0; }
.fg-rows { font: 400 14px/1.3 var(--sans); }
.fg-row { display: grid; grid-template-columns: 7.2rem 1fr; align-items: center; column-gap: 10px; }
.fg-row + .fg-row { margin-top: 6px; }
.fg-track { display: flex; align-items: center; gap: 8px; border-left: 1px solid #CFCDC6; min-height: 28px; }
.fg-bar { display: block; height: 20px; border-radius: 0 4px 4px 0; flex: none; }
.fg-bar.focus { background: var(--ink); }
.fg-bar.ctx { background: #8A887F; }
.fg-val { font-weight: 600; white-space: nowrap; }
.fg-axis { display: grid; grid-template-columns: 1fr 1fr; font: 400 12px/1.2 var(--sans); color: var(--graphite); margin-bottom: 6px; }
.fg-axis span:first-child { text-align: right; padding-right: 8px; }
.fg-axis span:last-child { padding-left: 8px; }
.fg-change .fg-label { display: block; margin: 8px 0 4px; }
.fg-div { display: grid; grid-template-columns: 1fr 1fr; }
.fg-half { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.fg-half.neg { flex-direction: row-reverse; }
.fg-half.pos { border-left: 1px solid #CFCDC6; }
.fg-half.neg .fg-bar { border-radius: 4px 0 0 4px; }
.photo-frame { aspect-ratio: 3 / 2; border-radius: 4px; overflow: hidden; background: var(--stone); }
.photo-frame svg { display: block; width: 100%; height: 100%; }

/* ── in brief ── */
.briefs { margin-top: 8px; padding-top: 34px; border-top: 2px solid var(--ink); }
.section-title { font: 500 26px/1.2 var(--serif); margin: 0 0 6px; letter-spacing: -0.01em; }
html[lang="zh"] .section-title { font-weight: 600; letter-spacing: 0; }
.brief-list { list-style: none; padding: 0; margin: 0; }
.brief { padding: 14px 0; border-top: 1px solid var(--hairline); }
.brief:first-child { border-top: 0; }
.brief-text { margin: 4px 0 2px; font-size: 17px; line-height: 1.5; }
.brief-src { font: 400 13.5px/1.4 var(--sans); color: var(--graphite); margin: 0; }
.rumor { font-style: italic; }

/* ── done ── */
.done { margin-top: 30px; padding: 48px 0 40px; border-top: 2px solid var(--ink); }
.done-title { font: 500 36px/1.08 var(--serif); letter-spacing: -0.02em; margin: 0 0 10px; font-variation-settings: "opsz" 60; }
html[lang="zh"] .done-title { font-weight: 600; font-size: 30px; letter-spacing: 0; line-height: 1.3; text-wrap: balance; }
.done-sub { font: 400 16px/1.45 var(--sans); color: var(--graphite); margin: 0 0 30px; }
.feedback p { font: 600 15px/1.3 var(--sans); margin: 0 0 10px; }
.fb-btns { display: flex; gap: 10px; }
.chip-btn {
  font: 500 15px/1 var(--sans); background: none; border: 1px solid var(--ink); border-radius: 999px;
  padding: 0 18px; min-height: 44px; cursor: pointer;
}
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.fb-thanks { font: 400 14px/1.4 var(--sans) !important; color: var(--graphite); margin-top: 10px !important; }
.subscribe { margin-top: 34px; font-family: var(--sans); }
.subscribe label { display: block; font: 600 15px/1.3 var(--sans); margin: 0 0 10px; }
.row { display: flex; gap: 8px; }
.row input {
  flex: 1; min-width: 0; font: 400 16px/1.2 var(--sans); padding: 12px 12px; min-height: 46px;
  border: 1px solid var(--ink); border-radius: 4px; background: var(--paper);
}
.solid-btn {
  font: 600 16px/1 var(--sans); background: var(--ink); color: var(--paper); border: 0; border-radius: 4px;
  padding: 0 18px; min-height: 46px; cursor: pointer; white-space: nowrap;
}
.fine { font: 400 13px/1.4 var(--sans); color: var(--graphite); margin: 8px 0 0; }
.done-links { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 26px; }
.done-links .text-btn { font-weight: 500; }

/* ── footer ── */
.foot { padding: 26px 0 72px; border-top: 1px solid var(--hairline); font: 400 13px/1.5 var(--sans); color: var(--graphite); }
.foot p { margin: 0 0 8px; }
.foot-links { display: flex; gap: 18px; }
.foot-links a { color: var(--ink); }

/* ── ask sheet ── */
.sheet-root { position: fixed; inset: 0; z-index: 40; }
.sheet-root[hidden] { display: none; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .32); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%;
  display: flex; flex-direction: column; background: var(--paper); border-radius: 14px 14px 0 0;
  padding: 8px 20px calc(14px + env(safe-area-inset-bottom)); font-family: var(--sans);
  animation: sheet-up .26s cubic-bezier(.2, .8, .2, 1);
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: .4; } }
.handle { width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); margin: 0 auto 10px; flex: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-title { font: 600 14px/1.3 var(--sans); color: var(--green); margin: 0; }
.sheet-story { font: 500 19px/1.25 var(--serif); margin: 2px 0 6px; letter-spacing: -0.005em; }
html[lang="zh"] .sheet-story { font-weight: 600; font-size: 17px; line-height: 1.5; }
.sheet-note { font: 400 13.5px/1.4 var(--sans); color: var(--graphite); margin: 0 0 12px; }
.sheet-body { overflow: auto; flex: 1; min-height: 80px; }
.thread-q { font: 600 16px/1.4 var(--sans); margin: 4px 0 8px; }
.sheet-form { flex: none; padding-top: 10px; border-top: 1px solid var(--hairline); }
.quota { font: 400 12.5px/1.3 var(--sans); color: var(--graphite); margin: 8px 0 0; }
.gate { background: var(--mint); border-radius: 4px; padding: 16px; }
.gate p { margin: 0 0 12px; font: 400 15px/1.45 var(--sans); }

/* ── desktop: answers sit in a margin column beside the story ── */
@media (min-width: 1024px) {
  .page { padding: 0 48px; }
  .date { font-size: 60px; }
  .story { display: grid; grid-template-columns: minmax(0, var(--measure)) minmax(15rem, 21rem); column-gap: 64px; align-items: start; }
  .story-ask { margin-top: 0; padding: 4px 0 0 24px; border-left: 1px solid var(--hairline); position: sticky; top: 24px; }
  .sheet { left: auto; top: 24px; right: 24px; bottom: 24px; width: 440px; max-height: none; border-radius: 10px; padding-top: 18px; }
  .handle { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── email view ── */
body.email-view { background: var(--stone); }
.email { max-width: 600px; margin: 0 auto; background: var(--paper); padding: 22px 20px 30px; }
.email-head { font: 400 13px/1.45 var(--sans); color: var(--graphite); border-bottom: 1px solid var(--hairline); padding-bottom: 12px; margin-bottom: 4px; }
.email-head b { color: var(--ink); font-weight: 600; }
.email .story { padding: 28px 0 26px; }
.email .is-top { margin-top: 28px; }
.email-ask { font: 600 15px/1.4 var(--sans); margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.email-ask a { color: var(--green); }
.email-ask a + a { color: var(--ink); font-weight: 500; }
.email-foot { font: 400 12.5px/1.5 var(--sans); color: var(--graphite); padding-top: 22px; border-top: 1px solid var(--hairline); margin-top: 28px; }
.email-foot a { color: var(--ink); }
</style>
</head>

function fmtTime(iso) {
  const d = new Date(iso);
  if (lang === 'zh') {
    return `${d.getUTCMonth() + 1} 月 ${d.getUTCDate()} 日 ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')} UTC`;
  }
  const mon = d.toLocaleString('en-US', { month: 'short', timeZone: 'UTC' });
  return `${mon} ${d.getUTCDate()}, ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')} UTC`;
}

function withMarks(s, text, interactive) {
  return text.replace(/<m(\d)>(.*?)<\/m\1>/g, (_, i, inner) => interactive
    ? `<span class="mark" role="button" tabindex="0" data-action="mark" data-id="${s.id}" data-m="${i}" aria-expanded="false" aria-controls="proof-${s.id}">${inner}</span>`
    : `<span class="mark">${inner}</span>`);
}

function withCites(text, key) {
  return text.replace(/\[(\d)\]/g, (_, n) => `<a class="cite-ref" href="#${key}-${n}" aria-label="Source ${n}">${n}</a>`);
}

function quoteBlock(s, c) {
  const src = s.sources[c.src];
  const needsTr = src.lang !== lang && c.tr && c.tr[lang];
  return { src, needsTr };
}

function answerHTML(s, status, text, cites, key, opts = {}) {
  const T = UI[lang];

    const src = s.sources[c.src];
    const tr = src.lang !== lang && c.tr && c.tr[lang] ? `<span>${esc(T.translatedFrom(LANGS[src.lang][lang]))}${sep()}${esc(c.tr[lang])}</span>` : '';
    return `<li id="${key}-${i + 1}"><span class="cite-n">${i + 1}</span>${esc(KINDS[src.kind][lang])}${sep()}${esc(src.name[lang])}<span class="cite-quote" lang="${src.lang}">“${esc(c.quote)}”</span>${tr}</li>`;
  }).join('');
  const further = status === 'none' && opts.further
    ? `<button class="look-further" data-action="further">${esc(T.lookFurther)}</button><p class="look-note" hidden>${esc(T.lookNote)}</p>` : '';
  return `<div class="answer${opts.isNew ? ' is-new' : ''}">
    <p class="status"><span class="dot ${status}" aria-hidden="true"></span>${esc(T.status[status])}</p>
    <p class="answer-text">${withCites(esc(text), key)}</p>
    <ol class="cites">${citeItems}</ol>
    ${further}
    <p class="answer-foot">${esc(T.answerFoot)} <button class="text-btn" data-action="report">${esc(T.report)}</button></p>
  </div>`;
}

// Grid coordinates: one unit per 2° of longitude/latitude.
const gx = (lon) => (lon + 180) / WORLD.step;
const gy = (lat) => (WORLD.top - lat) / WORLD.step;

function landPath(x0 = 0, y0 = 0, x1 = 180, y1 = 69) {
  let d = '';
  WORLD.rows.forEach((runs, r) => {
    const y = r + 0.5;
    if (y < y0 || y > y1) return;
    runs.forEach(([start, len]) => {
      for (let c = start; c < start + len; c += 1) {
        const x = c + 0.5;
        if (x >= x0 && x <= x1) d += `M${x} ${y}h0`;
      }
    });
  });
  return d;
}

function worldMapHTML() {
  const T = UI[lang];
  const seen = new Set();
  const pins = [...STORIES, ...BRIEFS].map((s) => s.place).filter((p) => {
    const k = `${p.lon},${p.lat}`;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return `<svg class="world" viewBox="0 0 180 69" role="img" aria-label="${esc(T.coverageLabel)}">
    <path d="${landPath()}" stroke="#BEBBB3" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    ${pins.map((p) => `<circle cx="${gx(p.lon).toFixed(2)}" cy="${gy(p.lat).toFixed(2)}" r="1.7" fill="#000" stroke="#fff" stroke-width="0.6"/>`).join('')}
  </svg>`;
}

  return interactive
    ? `<span class="mark" role="button" tabindex="0" data-action="mark" data-id="${s.id}" data-m="${row.mark}" aria-expanded="false" aria-controls="proof-${s.id}">${shown}</span>`
    : `<span class="mark">${shown}</span>`;
}

function dataTable(v) {
  return `<table class="visually-hidden"><caption>${esc(v.title[lang])}</caption><tbody>${v.rows.map((r) => `<tr><th scope="row">${esc(r.label[lang])}</th><td>${esc(r.shown[lang])}</td></tr>`).join('')}</tbody></table>`;
}

function visualHTML(s, interactive = true) {
  const v = s.visual;
  if (!v) return '';
  if (v.type === 'image') {
    return `<figure class="visual photo">
      <div class="photo-frame" role="img" aria-label="${esc(v.alt[lang])}">${v.art === 'chip' ? officialChipSVG() : officialScreenshotSVG()}</div>
      <figcaption class="fg-credit">${esc(v.credit[lang])}</figcaption>
    </figure>`;
  }
  if (v.type === 'compare') {
    const max = Math.max(...v.rows.map((r) => r.value));
    const rows = v.rows.map((r) => `<div class="fg-row"><span class="fg-label">${esc(r.label[lang])}</span>
        <span class="fg-track"><span class="fg-bar ${r.focus ? 'focus' : 'ctx'}" style="width:calc((100% - 3.4rem) * ${r.value / max})"></span><span class="fg-val">${valueHTML(s, r, interactive)}</span></span></div>`).join('');
    return `<figure class="visual fact">
      <figcaption class="fg-title">${esc(v.title[lang])}</figcaption>
      <p class="fg-note">${esc(v.note[lang])}</p>
      <div class="fg-rows" aria-hidden="true">${rows}</div>
      ${dataTable(v)}
      <p class="fg-credit">${esc(v.credit[lang])}</p>
    </figure>`;
  }
  if (v.type === 'change') {
    const max = Math.max(...v.rows.map((r) => Math.abs(r.value)));
    const rows = v.rows.map((r) => {
      const bar = `<span class="fg-bar focus" style="width:calc((100% - 3.6rem) * ${Math.abs(r.value) / max})"></span><span class="fg-val">${valueHTML(s, r, interactive)}</span>`;
      return `<div class="fg-change"><span class="fg-label">${esc(r.label[lang])}</span>
        <div class="fg-div"><span class="fg-half neg">${r.value < 0 ? bar : ''}</span><span class="fg-half pos">${r.value > 0 ? bar : ''}</span></div></div>`;
    }).join('');
    return `<figure class="visual fact">
      <figcaption class="fg-title">${esc(v.title[lang])}</figcaption>
      <div class="fg-rows" aria-hidden="true" style="margin-top:10px">
        <div class="fg-axis"><span>${esc(v.axis[lang][0])}</span><span>${esc(v.axis[lang][1])}</span></div>${rows}</div>
      ${dataTable(v)}
      <p class="fg-credit">${esc(v.credit[lang])}</p>
    </figure>`;
  }
  return '';
}

function storyHTML(s) {
  const T = UI[lang];
  const L = s[lang];
  const sources = s.sources.map((src) => {
    const notes = [src.lang !== lang ? LANGS[src.lang][lang] : '', src.paywall ? T.paywall : ''].filter(Boolean).join(', ');
    return `<li><span class="kind">${esc(KINDS[src.kind][lang])}</span><span>${esc(src.name[lang])}${notes ? `, ${esc(notes)}` : ''}<br>${esc(fmtTime(src.time))}</span><a href="#" onclick="return false">${esc(T.open)}</a></li>`;
  }).join('');
  const asks = L.ask.map((a, i) => `<li>
      <button class="ask-q" data-action="ask" data-id="${s.id}" data-i="${i}" aria-expanded="false" aria-controls="ans-${s.id}-${i}"><span>${esc(a.q)}</span><span class="pm" aria-hidden="true"></span></button>
      <div id="ans-${s.id}-${i}" hidden></div>
    </li>`).join('');
  return `<article class="story${s.top ? ' is-top' : ''}" id="s-${s.id}">
    <div class="story-main">
      <p class="meta">${logoHTML(s.org)}<span class="region">${esc(REGIONS[s.region][lang])}</span><span>${esc(L.cat)}</span></p>
      <h2 class="title">${esc(L.title)}</h2>
      <p class="summary">${withMarks(s, L.summary, true)}</p>
      <div id="proof-${s.id}"></div>
      ${visualHTML(s)}
      <div class="why"><p class="label">${esc(T.why)}</p><p>${esc(L.why)}</p></div>
      ${L.next ? `<div class="next"><p class="label">${esc(T.next)}</p><p>${esc(L.next)}</p></div>` : ''}
      <div class="sources">
        <div class="sources-row"><span>${esc(L.sourceLine)}</span><button class="text-btn" data-action="sources" data-id="${s.id}" aria-expanded="false" aria-controls="src-${s.id}">${esc(T.seeSources)}</button></div>
        <ul class="source-list" id="src-${s.id}" hidden>${sources}</ul>
      </div>
    </div>
    <aside class="story-ask" aria-label="${esc(T.askAbout)}">
      <p class="ask-label">${esc(T.ask)}</p>
      <ul class="ask-list">${asks}
        <li><button class="ask-own" data-action="sheet" data-id="${s.id}"><span>${esc(T.askOwn)}</span></button></li>
      </ul>
    </aside>
  </article>`;
}

function renderWeb() {
  const T = UI[lang];
  const briefs = BRIEFS.map((b) => `<li class="brief">
      <p class="meta">${logoHTML(b.org)}<span class="region">${esc(REGIONS[b.region][lang])}</span>${b.kind === 'rumor' ? `<span class="rumor">${esc(T.rumorTag)}</span>` : ''}</p>
      <p class="brief-text">${esc(b[lang])}</p>
      <p class="brief-src">${esc(KINDS[b.kind][lang])}${sep()}${esc(b.src[lang])}</p>
    </li>`).join('');
  return `
  <header class="masthead page">
    <div class="topline">
      <span class="wordmark" role="img" aria-label="AI in 5">${LOCKUP}</span>
      <nav class="langs" aria-label="Language">
        <button data-action="lang" data-lang="en" aria-pressed="${lang === 'en'}">EN</button>
        <button data-action="lang" data-lang="zh" aria-pressed="${lang === 'zh'}">中文</button>
      </nav>
    </div>
    <h1 class="date">${esc(T.date)}</h1>
    <p class="dek">${esc(T.dek)}</p>
    ${coverageHTML()}
  </header>
  <section class="today page" aria-labelledby="t3">
    <div class="measure">
      <h2 class="label" id="t3">${esc(T.todayIn3)}</h2>
      <ol class="t3">${T.t3.map(([id, text]) => `<li><a href="#s-${id}" data-action="jump" data-id="${id}">${esc(text)}</a></li>`).join('')}</ol>
    </div>
  </section>
  <main class="page">
    ${STORIES.map(storyHTML).join('')}
    <section class="briefs measure" aria-labelledby="ib">
      <h2 class="section-title" id="ib">${esc(T.inBrief)}</h2>
      <ul class="brief-list">${briefs}</ul>
    </section>
    <section class="done measure" id="done">
      <p class="done-title">${esc(T.doneTitle)}</p>
      <p class="done-sub">${esc(T.doneSub)}</p>
      <div class="feedback">
        <p>${esc(T.useful)}</p>
        <div class="fb-btns">
          <button class="chip-btn" data-action="fb" aria-pressed="false">${esc(T.yes)}</button>
          <button class="chip-btn" data-action="fb" aria-pressed="false">${esc(T.no)}</button>
        </div>
        <p class="fb-thanks" hidden>${esc(T.thanks)}</p>
      </div>
      <form class="subscribe" data-form="subscribe">
        <label for="sub-email">${esc(T.subLabel)}</label>
        <div class="row"><input id="sub-email" type="email" autocomplete="email" placeholder="you@example.com" required><button class="solid-btn" type="submit">${esc(T.subBtn)}</button></div>
        <p class="fine">${esc(T.subFine)}</p>
      </form>
      <div class="done-links">
        <button class="text-btn" data-action="share">${esc(T.share)}</button>
        <a class="text-btn" href="#" onclick="return false">${esc(T.yesterday)}</a>
      </div>
    </section>
    <footer class="foot measure">
      <p>${esc(T.footer)}</p>
      <p class="foot-links"><a href="#" onclick="return false">${esc(T.how)}</a><a href="#" onclick="return false">${esc(T.corrections)}</a><a href="#" onclick="return false">${esc(T.archive)}</a></p>
      <p>${esc(T.sample)}</p>
    </footer>
  </main>`;
}

function renderEmail() {
  const T = UI[lang];
  const stories = STORIES.map((s) => {
    const L = s[lang];
    return `<div class="story${s.top ? ' is-top' : ''}">
      <p class="meta">${logoHTML(s.org)}<span class="region">${esc(REGIONS[s.region][lang])}</span><span>${esc(L.cat)}</span></p>
      <h2 class="title">${esc(L.title)}</h2>
      <p class="summary">${withMarks(s, L.summary, false)}</p>
      ${visualHTML(s, false)}
      <div class="why"><p class="label">${esc(T.why)}</p><p>${esc(L.why)}</p></div>
      <p class="sources">${esc(L.sourceLine)}</p>
      <p class="email-ask"><a href="#" onclick="return false">${esc(T.emailAsk)}</a><a href="#" onclick="return false">${esc(T.emailWeb)}</a></p>
    </div>`;
  }).join('');
  const briefs = BRIEFS.map((b) => `<li class="brief"><p class="meta">${logoHTML(b.org)}<span class="region">${esc(REGIONS[b.region][lang])}</span>${b.kind === 'rumor' ? `<span class="rumor">${esc(T.rumorTag)}</span>` : ''}</p><p class="brief-text">${esc(b[lang])}</p></li>`).join('');
  return `<div class="email">
    <div class="email-head"><b>${esc(T.emailFrom)}</b> AI in 5<br><b>${esc(T.emailSubject)}</b> ${esc(T.t3[0][1])}</div>
    <div class="masthead"><span class="wordmark" role="img" aria-label="AI in 5">${LOCKUP}</span><h1 class="date">${esc(T.date)}</h1><p class="dek">${esc(T.dek)}</p>${coverageHTML()}</div>
    <div class="today"><p class="label">${esc(T.todayIn3)}</p><ol class="t3">${T.t3.map(([, text]) => `<li><a href="#" onclick="return false">${esc(text)}</a></li>`).join('')}</ol></div>
    ${stories}
    <div class="briefs"><h2 class="section-title">${esc(T.inBrief)}</h2><ul class="brief-list">${briefs}</ul></div>
    <div class="email-foot">
      <p>${esc(T.footer)} <a href="#" onclick="return false">${esc(T.how)}</a></p>
      <p>${esc(T.emailFoot)} <a href="#" onclick="return false">${esc(T.unsubscribe)}</a>. <a href="#" onclick="return false">${esc(T.changeLang)}</a>.</p>
      <p>${esc(T.address)}</p>
      <p>${esc(T.sample)}</p>
    </div>
  </div>`;
}

function render() {
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
  document.body.classList.toggle('email-view', view === 'email');
  $('#app').innerHTML = view === 'email' ? renderEmail() : renderWeb();
  if (sheetStory) renderSheet();
  onScroll();
}

/* ───────── interactions ───────── */

function toggleMark(id, m, force) {
  const s = story(id);
  const el = document.querySelector(`.mark[data-id="${id}"][data-m="${m}"]`);
  const slot = $(`#proof-${id}`);
  const open = force ?? el.getAttribute('aria-expanded') !== 'true';
  document.querySelectorAll(`.mark[data-id="${id}"]`).forEach((x) => x.setAttribute('aria-expanded', 'false'));
  if (!open) { slot.innerHTML = ''; return; }
  el.setAttribute('aria-expanded', 'true');
  const mk = s.marks[m];
  const src = s.sources[mk.src];
  const T = UI[lang];
  const tr = src.lang !== lang && mk.tr[lang] ? `<p class="proof-meta">${esc(T.translatedFrom(LANGS[src.lang][lang]))}${sep()}${esc(mk.tr[lang])}</p>` : '';
  slot.innerHTML = `<div class="proof" role="note">
    <p class="proof-head">${esc(T.matches)}</p>
    <p class="proof-quote" lang="${src.lang}">“${esc(mk.quote)}”</p>
    ${tr}
    <p class="proof-meta">${esc(KINDS[src.kind][lang])}${sep()}${esc(src.name[lang])}, ${esc(fmtTime(src.time))}</p>
  </div>`;
}

function toggleAsk(id, i, force) {
  const s = story(id);
  const btn = document.querySelector(`.ask-q[data-id="${id}"][data-i="${i}"]`);
  const box = $(`#ans-${id}-${i}`);
  const open = force ?? btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', String(open));
  if (!open) { box.hidden = true; box.innerHTML = ''; return; }
  const a = s.ask[i];
  box.innerHTML = answerHTML(s, a.status, s[lang].ask[i].a, a.cites, `c-${id}-${i}`, { isNew: true });
  box.hidden = false;
}

function openSheet(id) {
  sheetStory = id;
  thread = [];
  renderSheet();
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = $('#sheet input'); if (f && !params.get('state')) f.focus(); }, 30);
}

function closeSheet() {
  sheetStory = null;
  $('#sheet').hidden = true;
  $('#sheet').innerHTML = '';
  document.body.style.overflow = '';
}

function renderSheet() {
  const T = UI[lang];
  const s = story(sheetStory);
  const items = thread.map((t, k) => `<p class="thread-q">${esc(t.q)}</p>${answerHTML(s, t.status, t.a, t.cites, `f-${s.id}-${k}`, { further: true, isNew: k === thread.length - 1 })}`).join('');
  const form = subscribed
    ? `<form class="sheet-form" data-form="ask"><div class="row"><input type="text" name="q" maxlength="100" placeholder="${esc(T.placeholder)}" aria-label="${esc(T.placeholder)}" ${quota === 0 ? 'disabled' : ''}><button class="solid-btn" type="submit" ${quota === 0 ? 'disabled' : ''}>${esc(T.askBtn)}</button></div><p class="quota">${esc(T.quota(quota))}</p></form>`
    : `<form class="gate" data-form="gate"><p>${esc(T.gateText)}</p><div class="row"><input type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email" required><button class="solid-btn" type="submit">${esc(T.gateBtn)}</button></div></form>`;
  $('#sheet').innerHTML = `<div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head"><p class="sheet-title" id="sheet-title">${esc(T.sheetTitle)}</p><button class="text-btn" data-action="close-sheet">${esc(T.close)}</button></div>
      <p class="sheet-story">${esc(s[lang].title)}</p>
      <p class="sheet-note">${esc(T.sheetNote(s.sources.length))}</p>
      <div class="sheet-body">${items}</div>
      ${subscribed ? form : ''}
      ${subscribed ? '' : form}
    </div>`;
  const body = $('#sheet .sheet-body');
  if (body) body.scrollTop = body.scrollHeight;
}

function answerFreeform(q) {
  const s = story(sheetStory);
  const ff = s.freeform;
  const ql = q.toLowerCase();
  for (const [i, a] of s[lang].ask.entries()) {
    const words = a.q.toLowerCase().replace(/[?？“”’]/g, '').split(/\s+/).filter((w) => w.length > 3);
    if (words.length && words.filter((w) => ql.includes(w)).length >= 2) {
      return { q, status: s.ask[i].status, a: a.a, cites: s.ask[i].cites };
    }
  }
  if (ff) return { q, status: 'none', a: ff[lang].a, cites: ff.cites };
  return { q, status: 'none', a: UI[lang].genericNone, cites: [{ src: s.marks[0].src, quote: s.marks[0].quote, tr: s.marks[0].tr }] };
}

function submitQuestion(q) {
  if (!q.trim() || quota === 0) return;
  thread.push(answerFreeform(q.trim()));
  quota -= 1;
  renderSheet();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;
  if (a === 'lang') { lang = t.dataset.lang; render(); }
  if (a === 'jump') { e.preventDefault(); $(`#s-${t.dataset.id}`).scrollIntoView({ block: 'start' }); }
  if (a === 'mark') toggleMark(t.dataset.id, +t.dataset.m);
  if (a === 'ask') toggleAsk(t.dataset.id, +t.dataset.i);
  if (a === 'sheet') openSheet(t.dataset.id);
  if (a === 'close-sheet') closeSheet();
  if (a === 'sources') {
    const list = $(`#src-${t.dataset.id}`);
    const open = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', String(open));
    t.textContent = open ? UI[lang].hideSources : UI[lang].seeSources;
    list.hidden = !open;
  }
  if (a === 'fb') {
    t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
    t.closest('.feedback').querySelector('.fb-thanks').hidden = false;
  }
  if (a === 'share') { t.textContent = UI[lang].shared; }
  if (a === 'report') { t.replaceWith(Object.assign(document.createElement('span'), { textContent: UI[lang].reportedThanks })); }
  if (a === 'further') { t.nextElementSibling.hidden = false; t.disabled = true; }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheetStory) closeSheet();
  const t = e.target.closest && e.target.closest('.mark[role="button"]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleMark(t.dataset.id, +t.dataset.m); }
});

document.addEventListener('submit', (e) => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === 'subscribe') {
    subscribed = true;
    f.innerHTML = `<p class="fine" style="font-size:15px;color:var(--ink)">${esc(UI[lang].subDone)}</p>`;
  }
  if (f.dataset.form === 'gate') { subscribed = true; renderSheet(); const i = $('#sheet input'); if (i) i.focus(); }
  if (f.dataset.form === 'ask') submitQuestion(f.q.value);
});

function onScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  $('.progress span').style.width = `${max > 0 ? Math.min(100, (scrollY / max) * 100) : 0}%`;
}
addEventListener('scroll', onScroll, { passive: true });

/* ───────── preset states for the design board ───────── */

function scrollToEl(el, offset) {
  window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - offset, behavior: 'instant' });
}

function applyState() {
  const st = params.get('state');
  if (view === 'email') { $('.progress').hidden = true; return; }
  if (st === 'fact') { toggleMark('qilin', 0, true); scrollToEl($('#s-qilin .meta'), 24); }
  if (st === 'ask') { toggleAsk('qilin', 0, true); scrollToEl($('#s-qilin .why'), 16); }
  if (st === 'ask-desktop') { toggleAsk('qilin', 1, true); toggleMark('qilin', 0, true); scrollToEl($('#s-qilin'), 0); }
  if (st === 'sheet') { subscribed = true; quota = 3; openSheet('qilin'); submitQuestion(story('qilin').freeform[lang].q); scrollToEl($('#s-qilin .why'), 16); }
  if (st === 'gate') { subscribed = false; openSheet('qilin'); scrollToEl($('#s-qilin .why'), 16); }
  if (st === 'done') { scrollToEl($('#done'), 0); }
  if (st === 'chart') { scrollToEl($('#s-qilin .summary'), 16); }
  if (st === 'image') { scrollToEl($('#s-northwind .meta'), 24); }
  if (st === 'change') { scrollToEl($('#s-cobalt .meta'), 24); }
  if (st === 'photo') { scrollToEl($('#s-lingxin .meta'), 24); }
  if (st === 'noimage') { scrollToEl($('#s-aster .meta'), 24); }
  if (st === 'briefs') { scrollToEl($('.briefs'), 0); }
  onScroll();
}

render();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(applyState, 60));
</script>
</body>
</html>
